services:
  - type: web
    name: uk-student-niec
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: uk-student-niec-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: STUDENT_DETAILS_DATA_DIR
        value: /data/student-details
      - key: COUNSELOR_DATA_DIR
        value: /data/counselor-incentive
      - key: INCENTIVE_PASSWORD
        sync: false # set in the Render dashboard, never in git
