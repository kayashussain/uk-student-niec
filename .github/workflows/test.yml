name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in gateway/server.js scripts/*.js shared/*.js student-details/*.js student-details/seed-tools/*.js counselor-incentive/*.js; do node --check "$f"; done
      - name: Browser tools (so the UI and accessibility tests run too)
        run: npm i --no-save playwright axe-core && npx playwright install --with-deps chromium
      - run: npm test
