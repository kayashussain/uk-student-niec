<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Dashboard · ISR</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="niec-header" data-page="dashboard"></header>

  <main class="page first-load" id="page">
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
        <p>How this intake is doing and where it is heading.</p>
      </div>
      <div class="filters" role="group" aria-label="Filter">
        <label>Intake <select id="intake"></select></label>
        <span class="updated" id="updated"></span>
      </div>
    </div>

    <div class="p-tabs no-print" id="dashTabs" role="tablist" aria-label="Dashboard pages">
      <button type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button type="button" role="tab" data-tab="decisions" aria-selected="false">Decisions</button>
      <button type="button" role="tab" data-tab="channels" aria-selected="false">Marketing and sources</button>
      <button type="button" role="tab" data-tab="universities" aria-selected="false">Universities and partners</button>
      <button type="button" role="tab" data-tab="plan" aria-selected="false">Intake plan</button>
    </div>
    <div id="panel-insights" hidden></div>
    <div id="panel-overview"><div class="p-card">Loading…</div></div>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>

<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="card-fields.js"></script>
<script src="portal-ui.js"></script>
<script src="dashboard.js"></script>
<script src="dashboard-insights.js"></script>
</body>
</html>
