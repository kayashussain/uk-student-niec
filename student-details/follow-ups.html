<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Follow-ups · UK Student NIEC</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body class="p-body">
  <header class="niec-header" data-page="followups"></header>
  <main class="p-page">
    <div class="p-head">
      <div>
        <h1>Follow-ups</h1>
        <p>The students you promised to contact, oldest first. Clear this list every morning before new work.</p>
      </div>
      <div class="p-actions">
        <label class="p-field" style="min-width:200px"><span class="p-label">Show</span>
          <select id="who"><option value="mine">My students</option><option value="all">Everyone's</option></select></label>
        <button class="btn btn-primary" type="button" id="add">+ Add student</button>
      </div>
    </div>
    <div class="p-kpis" id="kpis"></div>
    <section class="p-card"><div class="p-card-head"><h2>To do</h2><span class="p-muted p-small" id="count"></span></div><div id="due"></div></section>
    <section class="p-card"><div class="p-card-head"><h2>Inquiries with no follow-up day</h2></div><p class="p-muted">Nobody has promised these students a call. Give each a day so none is forgotten.</p><div id="unplanned"></div></section>
  </main>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="card-fields.js"></script>
<script src="portal-ui.js"></script>
<script src="new-student.js"></script>
<script src="card-drawer.js"></script>
<script src="follow-ups-page.js"></script>
</body>
</html>
