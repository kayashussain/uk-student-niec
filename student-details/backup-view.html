<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Backup · UK Student NIEC</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="admin.css" />
<style>
  .page { max-width: none; padding: 12px 16px 24px; }
  .banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border: 1px solid var(--wait); background: var(--wait-bg); color: var(--wait); border-radius: 8px; margin-bottom: 12px; }
  .banner b { font-size: 15px; }
  .banner .btn { color: var(--text); }
  .viewer-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  .viewer-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .viewer-tabs button[aria-pressed="true"] { background: var(--blue-tint); border-color: var(--blue); font-weight: 600; }
  .sheet-scroll { overflow: auto; height: calc(100vh - 290px); min-height: 320px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--panel); }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; width: max-content; min-width: 100%; }
  table.grid th, table.grid td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 5px 9px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; text-align: left; vertical-align: top; text-transform: none; letter-spacing: 0; }
  table.grid thead th { position: sticky; top: 0; background: var(--blue-tint); color: var(--text); z-index: 2; font-size: 12px; font-weight: 700; }
  table.grid .rn { position: sticky; left: 0; background: var(--bg); color: var(--dim); text-align: right; z-index: 1; min-width: 40px; }
  table.grid thead .rn { z-index: 3; }
  table.grid tbody tr:hover td { background: var(--blue-tint); }
  .sheet-note { color: var(--dim); font-size: 12px; margin: 4px 0; }
  .view-search { max-width: 320px; }
</style>
</head>
<body>
  <header class="niec-header" data-page="activity"></header>
  <main class="page">
    <div class="banner" role="note">
      <div><b id="title">Backup</b><div id="when"></div></div>
      <div><span>Read only: this is an earlier copy of the data. Nothing here changes the live data.</span> <a class="btn btn-sm" href="/activity#restore">Back to Restore data</a></div>
    </div>
    <div class="viewer-tabs" id="parts" role="tablist" aria-label="What to view"></div>
    <div id="body"><p class="muted">Loading...</p></div>
  </main>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="backup-view.js"></script>
</body>
</html>
