<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Fact File · UK Student NIEC</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="fact-file.css" />
</head>
<body>
  <header class="niec-header" data-page="factfile"></header>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Fact File</h1>
        <p>One page for each university: entry requirements, language test, courses, location, intakes and the application process. Open one to read it, or to print it or save it as a PDF.</p>
      </div>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search universities" aria-label="Search universities" />
      </div>
    </div>
    <form class="add-row" id="addForm" hidden>
      <input id="addName" placeholder="Add a university, for example University of Essex" maxlength="120" required aria-label="University name" />
      <button class="btn btn-primary" type="submit">Add</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <div class="cards" id="cards"></div>
  </main>
<script src="session.js"></script>
<script src="header.js"></script>
<script src="fact-file.js"></script>
</body>
</html>
