<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Fact File · ISR</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="fact-file.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
<!-- The first picture of the page waits until the menu has been drawn (see the marker at the end), so moving between pages never flashes an empty menu. -->
<link rel="expect" href="#isr-ready" blocking="render" />
</head>
<body>
  <header class="niec-header" data-page="factfile"></header>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Fact File</h1>
        <p>Entry requirements, courses, intakes and how to apply, for each university.</p>
      </div>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search a university or a course   ( / )" aria-label="Search universities and courses" autocomplete="off" />
      </div>
    </div>
    <form class="add-row" id="addForm" hidden>
      <input id="addName" placeholder="Add a university, for example University of Essex" maxlength="120" required aria-label="University name" />
      <button class="btn btn-primary" type="submit">Add</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="cards" id="cards"></div>
  </main>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="backup-bar.js"></script>
<script src="card-fields.js"></script>
<script src="portal-ui.js"></script>
<script src="fact-file.js"></script>
<span id="isr-ready" hidden></span>
</body>
</html>
