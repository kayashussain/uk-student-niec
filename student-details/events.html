<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Events and marketing · ISR</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
<style>
  /* 🔴 CSS CHANGED (2026-11-13): Events and marketing, rebuilt as a ledger with an event page | from: four separate number tiles and a grid of big cards (each with its own figures), with the students of one in a small window | to: one calm summary band (Total investment, Enquiries, Visas, Cost per enquiry, Cost per visa) divided by fine lines with serif figures; filter pills (All, Campaigns, Events); every event as one row of a clean ledger (name in navy with its "where it ran" tag and dates, then Investment, Enquiries, Visas, Per enquiry and Per visa lined up in columns, and an arrow); a click opens the event as its own view: the name in a large navy serif, its figures in the same kind of band, a soft "Upload the enquiry list" panel with a review of every line in coloured groups (New, Match, Linked, Other event, Skipped) before anything is saved, and its enquiries (name, phone, stage tag, intake, the latest note) where a click opens the student card; the form keeps the "Where it ran" pills */
  .ev-page { max-width: 1480px; }
  .ev-band { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 8px 0 20px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); box-shadow: 0 1px 2px rgba(20, 27, 41, .04), 0 18px 36px -32px rgba(29, 47, 82, .55); overflow: hidden; }
  .ev-band > div { padding: 18px 22px; min-width: 0; }
  .ev-band > div + div { border-left: 1px solid var(--border); }
  .ev-band span { display: block; color: var(--text-dim); font-size: 14px; font-weight: 600; }
  .ev-band b { display: block; margin-top: 6px; font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1.1; color: var(--brand-navy, #1d2f52); overflow-wrap: anywhere; }
  .ev-band small { display: block; margin-top: 4px; color: var(--text-dim); font-size: 14px; }
  .ev-band .gold b { color: #6f5631; }
  @media (max-width: 1000px) { .ev-band { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ev-band > div + div { border-left: 0; } .ev-band > div { border-top: 1px solid var(--border); } }
  .ev-note { display: flex; align-items: baseline; gap: 10px; margin: 0 0 18px; padding: 14px 18px; border: 0; border-radius: 14px; background: var(--panel, #fbfbfd); color: #1d1d1f; font-size: 15px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 10px rgba(0, 0, 0, .04); }
  .ev-note::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #ff9500; transform: translateY(-1px); }
  .ev-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
  /* 🔴 CSS CHANGED (2026-11-14): the Events and marketing page brought to the same Apple look as the other pages | from: the All, Campaigns and Events switch with a black pill on the chosen one; a yellow bordered warning box; navy names; names of enquiries underlined; the columns of the enquiry list not lined up from row to row; a bronze arrow; the event title in a serif | to: the same grey segmented switch as everywhere, with a white pill that slides to the chosen one; a soft off-white notice with an orange dot; near-black names; enquiry names in near-black that turn blue on hover; columns that line up on every row; a grey arrow that moves right on hover; marketing campaigns tagged in soft orange instead of a bronze outline; the chosen place in the new event form in Apple blue instead of navy; rows that rise in one after another when the list opens; the title in the system font */
  .ev-pills { display: inline-flex; gap: 2px; padding: 3px; border: 0; border-radius: 12px; background: #e8e8ed; }
  .ev-pills button { min-height: 34px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 14.5px; font-weight: 500; color: #515154; cursor: pointer; transition: color .25s ease; }
  .ev-pills button.on { background: #fff; color: #1d1d1f; font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 2px 8px -4px rgba(0, 0, 0, .12); }
  /* the ledger */
  .ev-ledger { border: 1px solid var(--border); border-radius: 18px; background: var(--panel); overflow: hidden; box-shadow: 0 1px 2px rgba(20, 27, 41, .04); }
  .ev-lrow { display: grid; grid-template-columns: minmax(260px, 2.4fr) repeat(5, minmax(96px, 1fr)) 28px; gap: 12px; align-items: center; padding: 16px 22px; border-top: 1px solid var(--border); }
  .ev-lrow.head { border-top: 0; padding-top: 12px; padding-bottom: 12px; background: color-mix(in srgb, var(--gold-soft, #e2e7f0) 45%, var(--panel)); color: var(--text-dim); font-size: 14px; font-weight: 650; }
  .ev-lrow.item { cursor: pointer; transition: background-color .2s ease; animation: isr-row-in .45s cubic-bezier(.32, .72, 0, 1) backwards; animation-delay: calc(var(--i, 0) * 35ms); }
  .ev-lrow.item:hover, .ev-lrow.item:focus-visible { background: rgba(0, 0, 0, .025); outline: none; }
  .ev-lrow.item:active { background: rgba(0, 0, 0, .05); }
  .ev-lrow.item:hover .ev-go { color: #0071e3; transform: translateX(3px); }
  @keyframes isr-row-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .ev-lrow.item { animation: none; } }
  .ev-lrow .num { text-align: right; font-variant-numeric: tabular-nums; }
  .ev-lrow.item .num { font-size: 15.5px; font-weight: 600; color: var(--brand-navy, #1d2f52); }
  .ev-lrow.item .num.gold { color: #6f5631; }
  .ev-lname { font-size: 16.5px; font-weight: 600; color: #1d1d1f; }
  .ev-lmeta { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin-top: 4px; color: var(--text-dim); font-size: 14px; }
  .ev-go { color: #86868b; font-size: 18px; text-align: right; transition: transform .25s cubic-bezier(.32, .72, 0, 1), color .2s; }
  @media (max-width: 1000px) {
    .ev-lrow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .ev-lrow.head { display: none; }
    .ev-lrow > :first-child { grid-column: 1 / -1; }
    .ev-lrow .num { text-align: left; }
    .ev-lrow .num::before { content: attr(data-label); display: block; color: var(--text-dim); font-size: 13px; font-weight: 500; }
    .ev-go { display: none; }
  }
  .ev-tag { display: inline-block; padding: 2px 11px; border-radius: 999px; background: var(--gold-soft, #e2e7f0); color: var(--brand-navy, #1d2f52); font-size: 13.5px; font-weight: 650; }
  .ev-tag.mk { background: rgba(255, 149, 0, .12); border: 0; color: #b25000; }
  .ev-empty { padding: 40px; text-align: center; color: var(--text-dim); }
  /* one event */
  .ev-back { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 0; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 500; color: #0066cc; cursor: pointer; }
  .ev-back:hover { text-decoration: underline; }
  .ev-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .ev-head h2 { margin: 0; font-family: var(--font); font-size: 34px; font-weight: 650; letter-spacing: -.025em; line-height: 1.15; color: #1d1d1f; }
  .ev-head .ev-lmeta { margin-top: 10px; font-size: 15px; }
  .ev-panel { margin: 0 0 18px; padding: 24px 26px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); box-shadow: 0 1px 2px rgba(20, 27, 41, .04); }
  .ev-panel h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; color: var(--brand-navy, #1d2f52); }
  .ev-panel > p { margin: 0 0 16px; color: var(--text-dim); font-size: 15px; line-height: 1.55; }
  .ev-upload { display: flex; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; }
  .ev-upload label { display: flex; flex-direction: column; gap: 6px; color: var(--brand-navy, #1d2f52); font-size: 14px; font-weight: 600; }
  .ev-upload select { min-height: 46px; min-width: 220px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--edit-bg, #fbfcfd); font: inherit; font-size: 15px; }
  .ev-counts { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 12px; }
  .ev-count { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 650; border: 1px solid transparent; }
  .ev-count.new { background: var(--green-bg); color: var(--green-fg); }
  .ev-count.link { background: var(--gold-soft, #e2e7f0); color: var(--brand-navy, #1d2f52); }
  .ev-count.already { background: var(--soft); color: var(--text-dim); }
  .ev-count.other { background: var(--amber-bg); color: var(--amber-fg); }
  .ev-count.problem { background: var(--red-bg); color: var(--red-fg); }
  .ev-review { max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 14px; }
  .ev-rline { display: grid; grid-template-columns: 110px minmax(160px, 1.2fr) minmax(120px, 1fr) minmax(0, 2fr); gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 14.5px; }
  .ev-rline:first-child { border-top: 0; }
  .ev-rline .what { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; text-align: center; }
  .ev-rline .what.new { background: var(--green-bg); color: var(--green-fg); }
  .ev-rline .what.link { background: var(--gold-soft, #e2e7f0); color: var(--brand-navy, #1d2f52); }
  .ev-rline .what.already { background: var(--soft); color: var(--text-dim); }
  .ev-rline .what.other { background: var(--amber-bg); color: var(--amber-fg); }
  .ev-rline .what.problem { background: var(--red-bg); color: var(--red-fg); }
  .ev-rline .why { color: var(--text-dim); }
  /* 🔴 CSS CHANGED (2026-11-14): students on an earlier list but not on the one being uploaded | from: not shown at all | to: a soft panel with an orange dot above the review list, saying how many and that nothing changes for them, with their names as small grey pills that open the student's card */
  .ev-missing { margin: 0 0 12px; }
  .ev-missing-names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ev-missing-name { padding: 4px 11px; border: 0; border-radius: 980px; background: rgba(0, 0, 0, .05); color: #1d1d1f; font: inherit; font-size: 13.5px; cursor: pointer; transition: background-color .15s; }
  .ev-missing-name:hover { background: rgba(0, 113, 227, .12); color: #0066cc; }
  @media (max-width: 800px) { .ev-rline { grid-template-columns: minmax(0, 1fr); } }
  .ev-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .ev-people { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .ev-person { display: grid; grid-template-columns: minmax(170px, 1.3fr) 130px 180px 140px minmax(0, 2.2fr); gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 15px; }
  .ev-person.head { border-top: 0; background: color-mix(in srgb, var(--gold-soft, #e2e7f0) 45%, var(--panel)); color: var(--text-dim); font-size: 14px; font-weight: 650; }
  .ev-person .who { padding: 0; border: 0; background: none; font: inherit; font-weight: 600; color: #1d1d1f; text-align: left; cursor: pointer; transition: color .2s; }
  .ev-person .who:hover { color: #0066cc; }
  .ev-person .last { color: var(--text-dim); font-size: 14px; overflow-wrap: anywhere; }
  .ev-person .last b { color: var(--text); font-weight: 600; }
  @media (max-width: 900px) { .ev-person { grid-template-columns: minmax(0, 1fr); } .ev-person.head { display: none; } }
  .ev-search { width: 320px; max-width: 100%; height: 44px; padding: 0 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); font: inherit; font-size: 15px; }
  /* the form */
  .ev-choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .ev-choices button { min-height: 40px; padding: 0 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); font: inherit; font-size: 14.5px; font-weight: 600; color: var(--text); cursor: pointer; }
  .ev-choices button { transition: background-color .2s, color .2s, border-color .2s, transform .15s; }
  .ev-choices button:active { transform: scale(.96); }
  .ev-choices button.on, .ev-choices button.on:hover { border-color: #0071e3; background: #0071e3; color: #fff; }
  .ev-where { grid-column: 1 / -1; }
  /* 🔴 CSS CHANGED (2026-11-14): the investment of an event or campaign can be typed in rupees, dollars or pounds | from: one box "Investment (Rs)" | to: the amount box with a small segmented Rs, $ and £ switch on its right, and a grey line under it saying how it is counted */
  .ev-money-row { display: flex; align-items: center; gap: 8px; }
  .ev-money-row input { flex: 1; min-width: 0; }
  .ev-cur { flex: none; display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: #e8e8ed; }
  .ev-cur button { min-width: 36px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #515154; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color .2s, color .2s, box-shadow .2s; }
  .ev-cur button.on { background: #fff; color: #1d1d1f; box-shadow: 0 1px 2px rgba(0, 0, 0, .1), 0 2px 6px -3px rgba(0, 0, 0, .15); }
  .ev-conv { display: block; margin-top: 6px; color: #6e6e73; font-size: 13px; }
  .ev-choice-label { display: block; margin-bottom: 8px; color: var(--brand-navy, #1d2f52); font-size: 14px; font-weight: 600; }
</style>
<!-- The first picture of the page waits until the menu has been drawn (see the marker at the end), so moving between pages never flashes an empty menu. -->
<link rel="expect" href="#isr-ready" blocking="render" />
</head>
<body class="p-body">
  <header class="niec-header" data-page="events"></header>
  <main class="p-page ev-page">
    <div id="listView">
      <div class="p-head">
        <div>
          <h1>Events and marketing</h1>
          <p>Each event and campaign, its investment, and the enquiries and visas it led to.</p>
        </div>
        <div class="p-actions"><button class="btn btn-primary" type="button" id="add" hidden>+ New event or campaign</button></div>
      </div>
      <div class="ev-band" id="band"></div>
      <div id="note"></div>
      <div class="ev-bar">
        <div class="ev-pills" id="filter" role="group" aria-label="Show">
          <button type="button" data-f="all" class="on" aria-pressed="true">All</button>
          <button type="button" data-f="Marketing" aria-pressed="false">Campaigns</button>
          <button type="button" data-f="Event" aria-pressed="false">Events</button>
        </div>
        <span class="p-muted" id="count"></span>
      </div>
      <div class="ev-ledger" id="list"><div class="isr-skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div>
    </div>
    <section id="eventView" hidden></section>
  </main>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="portal-ui.js"></script>
<script src="student-file.js"></script>
<script src="card-drawer.js"></script>
<script src="events-page.js"></script>
<span id="isr-ready" hidden></span>
</body>
</html>
