<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Message templates · ISR</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body class="p-body">
  <header class="niec-header" data-page="templates"></header>
  <main class="p-page tp-page">
    <div class="p-head">
      <div>
        <h1>Message templates</h1>
        <p>The emails and WhatsApp messages your team sends from a student card. Words in curly brackets, like {first_name}, are filled in from the student.</p>
      </div>
      <div class="p-actions" id="actions"><button class="btn btn-primary" type="button" id="addTemplate">+ New template</button></div>
    </div>
    <div class="tp-note" id="mailNote" hidden></div>
    <div class="p-tabs" role="tablist" aria-label="Message templates">
      <button type="button" role="tab" data-view="templates" aria-selected="true">Templates</button>
      <button type="button" role="tab" data-view="signature" aria-selected="false">Email signature</button>
    </div>
    <div class="tp-layout" id="viewTemplates">
      <aside class="tp-side">
        <input class="tp-search" id="tpSearch" type="search" placeholder="Search templates" aria-label="Search templates" />
        <div class="tp-list" id="list"></div>
      </aside>
      <section id="editor"><p class="p-muted">Choose a template to edit it.</p></section>
    </div>
    <section class="tp-panel" id="viewSignature" hidden><div id="sig"></div></section>
  </main>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="portal-ui.js"></script>
<script src="templates-page.js"></script>
</body>
</html>
