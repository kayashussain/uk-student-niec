<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Details · UK Student NIEC</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="niec-header" data-page="sheet"></header>
  <div class="topbar" role="toolbar" aria-label="Student Details">
    <input id="search" type="search" placeholder="Search students, universities, status…" aria-label="Search" />
    <div class="toolbar-group">
      <button id="undoBtn" class="btn" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
      <button id="redoBtn" class="btn" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
    </div>
    <div class="toolbar-group">
      <button id="addRow" class="btn btn-primary" title="Add a new student">+ Add student</button>
      <button id="delRow" class="btn btn-danger" title="Click the row numbers (S.N) of the students to delete first. Ctrl+Click to pick several">Delete rows</button>
      <button id="exportExcel" class="btn">Export Excel</button>
    </div>
    <span id="viewOnly" class="view-only" hidden title="This account can look at students but not change anything">View only</span>
    <span id="status" class="save-status" role="status">All changes saved</span>
  </div>

  <div class="conflict-banner" id="conflictBanner" hidden>
    <span>This sheet was changed on another device or tab, so your latest edit wasn't saved. Reload to get the current version.</span>
    <button id="reloadBtn" class="btn btn-primary">Reload latest</button>
  </div>

  <div class="status-summary" id="statusSummary"></div>

  <div class="table-wrap">
    <table id="sheet">
      <thead>
        <tr id="headerRow"></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <div class="sheet-loading" id="sheetLoading" aria-hidden="true">
      <span class="ui-skeleton"></span><span class="ui-skeleton"></span><span class="ui-skeleton"></span><span class="ui-skeleton"></span>
      <span class="ui-skeleton"></span><span class="ui-skeleton"></span><span class="ui-skeleton"></span><span class="ui-skeleton"></span>
    </div>
    <div class="ui-empty sheet-empty" id="sheetEmpty" hidden>
      <span class="ui-empty-icon" aria-hidden="true"></span>
      <strong></strong>
      <span class="ui-empty-text"></span>
      <button type="button" class="btn" id="clearFilters" hidden>Clear search and filters</button>
    </div>
  </div>

  <div class="sheet-tabs" id="sheetTabs">
    <button id="addSheet" class="sheet-add-btn" title="Add sheet">+</button>
    <div class="sheet-tabs-list" id="sheetTabsList"></div>
  </div>

  <footer class="footbar">
    <span id="rowCount"></span>
    <span class="legend" aria-label="Colour key">
      <span><i class="key key-calc"></i>Worked out automatically</span>
      <span><i class="key key-dup"></i>Same phone number as another student</span>
      <span><i class="key key-defer"></i>Deferred, but no next sheet to move to</span>
    </span>
  </footer>

<script src="calc.js"></script>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="edit-guard.js"></script>
<script src="patch.js"></script>
<script src="teams.js"></script>
<script src="app.js"></script>
</body>
</html>
